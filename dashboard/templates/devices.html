{% extends "base.html" %}
{% block content %}
<div class="text-center text-white mb-4">
    <h2><i class="bi bi-hdd-network"></i> My Devices</h2>
</div>

<div class="sensor-card">
    <div id="devices-grid">
        <p class="text-muted">Loading devices...</p>
    </div>
</div>
{% endblock %}

{% block extra_js %}
<script>
    function safeNumber(value, decimals = 1, suffix = '') {
        if (value === null || value === undefined || value === '') return '--';
        const num = parseFloat(value);
        if (isNaN(num)) return '--';
        return num.toFixed(decimals) + suffix;
    }

    function loadDevices() {
        fetch('/api-proxy/devices')
            .then(r => r.json())
            .then(data => {
                if (data.error) {
                    document.getElementById('devices-grid').innerHTML =
                        `<p class="text-danger">Error: ${data.error}</p>`;
                    return;
                }

                const devices = data.devices || [];
                if (devices.length === 0) {
                    document.getElementById('devices-grid').innerHTML =
                        '<p class="text-muted">No devices found.</p>';
                    return;
                }

                document.getElementById('devices-grid').innerHTML = `
                <div class="row g-4">
                    ${devices.map(d => `
                        <div class="col-md-6">
                            <div class="card">
                                <div class="card-body">
                                    <h5 class="card-title">
                                        <span class="device-status-indicator device-status-${d.status || 'inactive'}"></span>
                                        ${d.name || 'Unnamed Device'}
                                    </h5>
                                    <p class="text-muted mb-2"><small>${d.device_id || ''}</small></p>
                                    <p class="card-text">${d.description || 'No description'}</p>
                                    <p class="text-muted"><small><i class="bi bi-person"></i> Owner: ${d.owner_name || 'Unknown'} (@${d.owner_username || 'N/A'})</small></p>
                                    <div class="row text-center">
                                        <div class="col-4">
                                            <small class="text-muted">Temp</small>
                                            <p class="mb-0"><strong>${safeNumber(d.temperature, 1, '°C')}</strong></p>
                                        </div>
                                        <div class="col-4">
                                            <small class="text-muted">pH</small>
                                            <p class="mb-0"><strong>${safeNumber(d.ph, 2)}</strong></p>
                                        </div>
                                        <div class="col-4">
                                            <small class="text-muted">Status</small>
                                            <p class="mb-0"><span class="status-badge status-${d.quality_status || 'UNKNOWN'}">${d.quality_status || '--'}</span></p>
                                        </div>
                                    </div>
                                    <div class="mt-3">
                                        <a href="/dashboard" class="btn btn-sm btn-primary w-100">
                                            <i class="bi bi-speedometer2"></i> View Dashboard
                                        </a>
                                    </div>
                                </div>
                            </div>
                        </div>
                    `).join('')}
                </div>
            `;
            });
    }

    loadDevices();
    setInterval(loadDevices, 30000);
</script>
{% endblock %}
