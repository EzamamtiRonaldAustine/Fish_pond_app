{% extends "base.html" %}
{% block content %}
<div class="d-flex align-items-center justify-content-center" style="min-height: 80vh;">
    <div class="col-11 col-sm-8 col-md-5 col-lg-4">
        <div class="sensor-card shadow-lg border-0 p-4 p-md-5">
            <div class="text-center mb-4">
                <i class="bi bi-droplet-fill text-primary" style="font-size: 3rem;"></i>
                <h2 class="fw-bold mt-2">Login</h2>
                <p class="text-muted small">Access your Fish Pond Monitor</p>
            </div>


            {% if error %}
            <div class="alert alert-danger border-0 small py-2">{{ error }}</div>
            {% endif %}

            <form method="post">
                <div class="mb-3">
                    <label class="form-label small fw-bold">Username</label>
                    <div class="input-group">
                        <span class="input-group-text bg-light border-0"><i class="bi bi-person"></i></span>
                        <input type="text" name="username" class="form-control bg-light border-0" placeholder="Enter username" required>
                    </div>
                </div>
                <div class="mb-4">
                    <label class="form-label small fw-bold">Password</label>
                    <div class="input-group">
                        <span class="input-group-text bg-light border-0"><i class="bi bi-lock"></i></span>
                        <input type="password" name="password" class="form-control bg-light border-0" placeholder="Enter password" required>
                    </div>
                    <div class="text-end mt-2">
                        <a href="/forgot-password" class="text-decoration-none small">Forgot Password?</a>
                    </div>
                </div>
                <button type="submit" class="btn btn-primary w-100 py-2 fw-bold shadow-sm">Sign In</button>
            </form>

            <div class="my-4"></div>

            <!-- Google Sign-In -->
            <script src="https://accounts.google.com/gsi/client" async defer></script>
            <div id="g_id_onload" data-client_id="{{ google_client_id }}" data-callback="handleCredentialResponse"
                data-auto_prompt="false">
            </div>
            <div class="g_id_signin w-100 mb-3" data-type="standard" data-shape="rectangular" data-theme="outline"
                data-text="signin_with" data-size="large" data-logo_alignment="center"></div>

            <p class="text-muted mt-4 text-center small">
                New here? <a href="/signup" class="text-decoration-none fw-bold">Create an account</a>
            </p>
        </div>
    </div>
</div>
{% endblock %}

{% block extra_js %}
<script>
    async function handleCredentialResponse(response) {
        try {
            const r = await fetch('/auth/google/callback', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ credential: response.credential })
            });
            const data = await r.json();

            if (r.ok) {
                if (data.access_token) {
                    localStorage.setItem('access_token', data.access_token);
                }
                location.href = '/';
            } else {
                alert('Google login failed: ' + (data.error || 'Unknown error'));
            }
        } catch (err) {
            console.error('Google login error:', err);
            alert('Failed to connect to login server');
        }
    }
</script>
{% endblock %}
