{% extends "base.html" %}
{% block content %}
<div class="d-flex align-items-center justify-content-center" style="min-height: 80vh; padding: 40px 0;">
    <div class="col-11 col-sm-10 col-md-8 col-lg-6">
        <div class="sensor-card shadow-lg border-0 p-4 p-md-5">
            <div class="text-center mb-4">
                <i class="bi bi-person-plus-fill text-success" style="font-size: 3rem;"></i>
                <h2 class="fw-bold mt-2">Create Farmer Account</h2>
                <p class="text-muted small">Join the AquaGuardian community</p>
            </div>

            {% if error %}
            <div class="alert alert-danger border-0 small py-2">{{ error }}</div>
            {% endif %}

            <form method="post" id="signup-form">
                <div class="row g-3">
                    <div class="col-md-6">
                        <label class="form-label small fw-bold">Username *</label>
                        <div class="input-group">
                            <span class="input-group-text bg-light border-0"><i class="bi bi-person"></i></span>
                            <input type="text" name="username" class="form-control bg-light border-0" placeholder="Unique username" required>
                        </div>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label small fw-bold">Email *</label>
                        <div class="input-group">
                            <span class="input-group-text bg-light border-0"><i class="bi bi-envelope"></i></span>
                            <input type="email" name="email" class="form-control bg-light border-0" placeholder="example@gmail.com" required>
                        </div>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label small fw-bold">Phone Number *</label>
                        <div class="input-group">
                            <span class="input-group-text bg-light border-0"><i class="bi bi-phone"></i></span>
                            <input type="tel" name="phone" class="form-control bg-light border-0" placeholder="07XXXXXXXX" pattern="[0-9]{10}" required>
                        </div>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label small fw-bold">Organization *</label>
                        <div class="input-group">
                            <span class="input-group-text bg-light border-0"><i class="bi bi-building"></i></span>
                            <select name="organization_id" class="form-select bg-light border-0" required id="org-select">
                                <option value="">Loading...</option>
                            </select>
                        </div>
                    </div>
                    <div class="col-md-12">
                        <label class="form-label small fw-bold">Full Name *</label>
                        <div class="input-group">
                            <span class="input-group-text bg-light border-0"><i class="bi bi-card-text"></i></span>
                            <input type="text" name="full_name" class="form-control bg-light border-0" placeholder="Your full name" required>
                        </div>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label small fw-bold">Password *</label>
                        <div class="input-group">
                            <span class="input-group-text bg-light border-0"><i class="bi bi-shield-lock"></i></span>
                            <input type="password" name="password" class="form-control bg-light border-0" minlength="6" required>
                        </div>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label small fw-bold">Confirm Password *</label>
                        <div class="input-group">
                            <span class="input-group-text bg-light border-0"><i class="bi bi-shield-check"></i></span>
                            <input type="password" name="confirm_password" class="form-control bg-light border-0" minlength="6" required>
                        </div>
                    </div>
                </div>
                <button type="submit" class="btn btn-success w-100 mt-4 py-2 fw-bold shadow-sm">Register Account</button>
            </form>

            <div class="my-4"></div>

            <!-- Google Sign-In -->
            <script src="https://accounts.google.com/gsi/client" async defer></script>
            <div id="g_id_onload" data-client_id="{{ google_client_id }}" data-callback="handleCredentialResponse"
                data-auto_prompt="false">
            </div>
            <div class="g_id_signin w-100 mb-3" data-type="standard" data-shape="rectangular" data-theme="outline"
                data-text="signup_with" data-size="large" data-logo_alignment="center"></div>

            <p class="text-center mt-4 small text-muted">
                Already have an account? <a href="/login" class="text-decoration-none fw-bold">Login here</a>
            </p>
        </div>
    </div>
</div>
{% endblock %}

{% block extra_js %}
<script>
    async function handleCredentialResponse(response) {
        try {
            const r = await fetch('/api-proxy/auth/google', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ credential: response.credential })
            });
            const data = await r.json();

            if (r.ok) {
                if (data.access_token) {
                    localStorage.setItem('access_token', data.access_token);
                }
                location.href = '/';
            } else {
                alert('Google signup failed: ' + (data.error || 'Unknown error'));
            }
        } catch (err) {
            console.error('Google signup error:', err);
            alert('Failed to connect to server');
        }
    }

    // Load organizations for dropdown
    fetch('/api-proxy/organizations/list')
        .then(r => r.json())
        .then(data => {
            const select = document.getElementById('org-select');
            if (data.organizations && data.organizations.length > 0) {
                select.innerHTML = '<option value="">Select your organization</option>' +
                    data.organizations.map(org =>
                        `<option value="${org.id}">${org.name}</option>`
                    ).join('');
            } else {
                select.innerHTML = '<option value="">No organizations available</option>';
            }
        })
        .catch(err => {
            console.error('Error loading organizations:', err);
        });

    // Form validation
    document.getElementById('signup-form').addEventListener('submit', (e) => {
        const password = document.querySelector('[name="password"]').value;
        const confirm = document.querySelector('[name="confirm_password"]').value;

        if (password !== confirm) {
            e.preventDefault();
            alert('Passwords do not match!');
        }
    });
</script>
{% endblock %}
